{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Прокат игр{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'rental/style.css' %}">
    <link rel="stylesheet" href="{% static 'rental/navigation.css' %}">
    <script src="{% static 'rental/navigation.js' %}" defer></script>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="{% url 'rental:catalog' %}"><span class="dice" aria-hidden="true">••<br>••</span>Прокат игр</a>
            <button class="menu-toggle" type="button" aria-controls="site-menu" aria-expanded="false" aria-label="Открыть меню">
                <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
                <span>Меню</span>
            </button>
            <div class="site-menu" id="site-menu">
                <nav class="main-nav" aria-label="Основная навигация">
                    <a href="{% url 'rental:catalog' %}"{% if request.resolver_match.url_name == 'catalog' %} aria-current="page"{% endif %}>Каталог</a><span class="nav-dot" aria-hidden="true">·</span><a href="{% url 'rental:subscription' %}">Подписка</a><span class="nav-dot" aria-hidden="true">·</span><a href="{% url 'rental:loans' %}">Мои аренды</a>
                </nav>
                <a class="login" href="{% url 'rental:login' %}">Войти</a>
            </div>
        </div>
    </header>
    <main class="container main-content">{% block content %}{% endblock %}</main>
    <footer class="site-footer"><div class="container">Прокат игр и оборудования</div></footer>
</body>
</html>
